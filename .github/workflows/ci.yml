name: CI

on:
  push:
  pull_request:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Run the pipeline on the real 2023 data (fails the build if quality gates fail)
        run: python -m pipeline
      - name: Build the report
        run: python -m pipeline.report --out data/REPORT.md
